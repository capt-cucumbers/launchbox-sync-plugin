name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers when you push a tag starting with "v" (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/LaunchBoxSyncPlugin.sln

      - name: Build project
        run: dotnet build tests/LaunchBoxSyncPlugin.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/LaunchBoxSyncPlugin.sln -c Release --no-restore

      - name: Create Release Package (Zip)
        shell: powershell
        run: |
          if (Test-Path "releases\LB External Game Sync Plugin\config.json") {
            Remove-Item "releases\LB External Game Sync Plugin\config.json" -Force
          }
          Compress-Archive -Path "releases\LB External Game Sync Plugin" -DestinationPath launchbox-sync-plugin.zip

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: launchbox-sync-plugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
