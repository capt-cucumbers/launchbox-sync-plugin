name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/LaunchBoxSyncPlugin.sln

      - name: Build project
        run: dotnet build tests/LaunchBoxSyncPlugin.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/LaunchBoxSyncPlugin.sln -c Release --no-restore
